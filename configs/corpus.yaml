# Curated biomedical corpus for the RAG index. Reproducible: `scripts/rag_index.py`
# runs these PubMed queries (+ any local guideline files) and builds the index.
# Sized to fit Neon free tier (~0.5 GB): ~5.4K abstracts -> ~25K chunks.
#
# Each query is field-scoped term logic, NOT a quoted phrase: the previous form
# ("hypertension treatment adults[Title/Abstract]") made PubMed match the exact
# phrase — 1 abstract for hypertension, 3 for diabetes — which is why the demo
# refused basic questions. Results are PubMed "Best Match" (sort=relevance).

retmax_per_query: 300        # abstracts per topic query

# Appended to every query: abstracts only, English, reviews/guidelines, 2010+.
query_filter: ' AND hasabstract AND english[la] AND ("review"[pt] OR "practice guideline"[pt] OR "guideline"[pt]) AND 2010:2026[dp]'

pubmed_queries:
  - '(type 2 diabetes[tiab]) AND (treatment[tiab] OR management[tiab] OR metformin[tiab])'
  - '(metformin[tiab]) AND (mechanism[tiab] OR pharmacology[tiab] OR "mechanism of action"[tiab])'
  - '(hypertension[tiab]) AND (antihypertensive[tiab] OR "first-line"[tiab] OR treatment[tiab])'
  - '("community-acquired pneumonia"[tiab]) AND (treatment[tiab] OR antibiotic*[tiab])'
  - '(asthma[tiab]) AND (management[tiab] OR inhaled corticosteroid*[tiab])'
  - '("major depressive disorder"[tiab] OR depression[ti]) AND (antidepressant*[tiab] OR treatment[tiab])'
  - '("ischemic stroke"[tiab]) AND (thrombolysis[tiab] OR thrombectomy[tiab] OR alteplase[tiab])'
  - '("chronic kidney disease"[tiab]) AND (management[tiab] OR treatment[tiab])'
  - '(sepsis[tiab] OR "septic shock"[tiab]) AND (diagnosis[tiab] OR "early recognition"[tiab] OR qSOFA[tiab] OR management[tiab])'
  - '(COPD[tiab]) AND (exacerbation*[tiab] OR bronchodilator*[tiab])'
  - '("atrial fibrillation"[tiab]) AND (anticoagulation[tiab] OR DOAC*[tiab] OR rate control[tiab])'
  - '("heart failure"[tiab]) AND (treatment[tiab] OR "guideline-directed"[tiab])'
  - '("acute coronary syndrome"[tiab] OR "myocardial infarction"[tiab]) AND (management[tiab] OR treatment[tiab])'
  - '(statin*[tiab] OR hypercholesterolemia[tiab]) AND (cardiovascular[tiab]) AND (prevention[tiab])'
  - '("urinary tract infection"[tiab]) AND (antibiotic*[tiab] OR treatment[tiab])'
  - '("antimicrobial resistance"[tiab] OR "antibiotic stewardship"[tiab])'
  - '(vaccin*[ti]) AND (adults[tiab]) AND (recommendation*[tiab] OR effectiveness[tiab])'
  - '(obesity[tiab]) AND (GLP-1[tiab] OR "weight loss"[tiab] OR pharmacotherapy[tiab])'

# Curated guideline text files are read from data/corpus/guidelines/{nih,who,cdc}/*.txt
guideline_sources: [nih, who, cdc]
